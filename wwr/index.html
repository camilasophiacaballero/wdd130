<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
      content="Kaiko Rafting Co. offers thrilling rafting adventures, expert guides, and unforgettable experiences.">
    <meta name="author" content="Camila Caballero">
    <title>Kaiko Rafting Co. - Home</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/kaiko.png" alt="Kaiko Rafting Co. logo">
        </div>
        <nav class="mainnav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/hero-home.jpg" alt="Rafting adventure on river">
            <h1>Life is a Journey</h1>
        </div>

        <section class="newsletter">
            <h2>Join Our Adventure Newsletter</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Sign Up</button>
            </form>
        </section>

        <section class="cta">
            <h2>Ready for the Rapids?</h2>
            <a href="trips.html">Explore Our Trips</a>
        </section>

        <section class="adventure">
            <h2>Our Adventures</h2>
            <figure>
                <img src="images/adventure1.jpg" alt="Rafting team working together">
                <figcaption>Teamwork on the River</figcaption>
            </figure>
            <figure>
                <img src="images/adventure2.jpg" alt="Rafting through thrilling river rapids">
                <figcaption>Thrilling Rapids</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>© 2026 Kaiko Rafting Co. — Camila Caballero, Tegucigalpa, Honduras</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
