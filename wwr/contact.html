<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
      content="Contact Kaiko Rafting Co. for reservations, inquiries, or suggestions." />
    <meta name="author" content="Camila Caballero" />
    <title>Kaiko Rafting Co. - Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css" />
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/kaiko.png" alt="Kaiko Rafting Co. logo" />
        </div>
        <nav class="mainnav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Kaiko Rafting Co.</h1>

        <section class="company-info">
            <h2>Our Information</h2>
            <p>123 Main River Street, Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!...etc" width="100%"
              height="250" allowfullscreen="" loading="lazy"></iframe>
        </section>

        <section class="contact-form">
            <h2>Get in Touch</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />

                <p>Message Purpose:</p>
                <label><input type="radio" name="purpose" value="general" /> General Inquiry</label>
                <label><input type="radio" name="purpose" value="reservation" /> Reservation
                    Question</label>
                <label><input type="radio" name="purpose" value="suggestion" /> Website
                    Suggestion</label>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label><input type="checkbox" name="newsletter" /> Please subscribe me to the
                    monthly newsletter</label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="John Doe - Lead Guide" />
                <figcaption>John Doe – Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Jane Smith - Customer Service" />
                <figcaption>Jane Smith – Customer Service</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Carlos Rivera - Safety Coordinator" />
                <figcaption>Carlos Rivera – Safety Coordinator</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>© 2026 Kaiko Rafting Co. — Camila Caballero, Tegucigalpa, Honduras</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook" /></a>
            <a href="#"><img src="images/linkedin.png" alt="LinkedIn" /></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram" /></a>
        </nav>
    </footer>
</body>

</html>
