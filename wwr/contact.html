<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
      content="Contact Kaiko Rafting Co. for reservations, inquiries, or suggestions." />
    <meta name="author" content="Camila Caballero" />
    <title>Kaiko Rafting Co. - Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css" />
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/kaiko.png" alt="Kaiko Rafting Co. logo" />
        </div>
        <nav class="mainnav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Kaiko Rafting Co.</h1>

        <section class="company-info">
            <h2>Our Information</h2>
            <p>1 Dr Carlton B Goodlett Pl, San Francisco, CA 94102</p>
            <p>+1 999 999 9999</p>
            <p>info@kaikowater.com</p>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019691652437!2d-122.41941568468174!3d37.77928097975795!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808c5b0b1f3f%3A0x8d2f0f0f0f0f0f0f!2sSan%20Francisco%20City%20Hall!5e0!3m2!1sen!2sus!4v1696350000000"
              width="100%" height="250" allowfullscreen="" loading="lazy">
            </iframe>
        </section>

        <section class="contact-form">
            <h2>Get in Touch</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />

                <p>Message Purpose:</p>
                <label for="general">
                    <input type="radio" id="general" name="purpose" value="general" /> General
                    Inquiry
                </label>
                <label for="reservation">
                    <input type="radio" id="reservation" name="purpose" value="reservation" />
                    Reservation Question
                </label>
                <label for="suggestion">
                    <input type="radio" id="suggestion" name="purpose" value="suggestion" /> Website
                    Suggestion
                </label>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" /> Please subscribe me
                    to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="John Doe - Lead Guide" />
                <figcaption>John Doe – Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Jane Smith - Customer Service" />
                <figcaption>David Smith – Customer Service</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Carlos Rivera - Safety Coordinator" />
                <figcaption>Carlos Rivera – Safety Coordinator</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>© 2026 Kaiko Rafting Co. — Camila Caballero, Tegucigalpa, Honduras</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook" /></a>
            <a href="#"><img src="images/linkedin.png" alt="LinkedIn" /></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram" /></a>
        </nav>
    </footer>
</body>

</html>
